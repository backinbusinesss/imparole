<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina non trovata — Imparole</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/imparole/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1E1A4D; --violet:#5B3FD9; --sun:#FFC93C; --mint:#2FB892; --coral:#FF7A6B; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F6FB; color: var(--ink); font: 1.0625rem/1.6 "Atkinson Hyperlegible", system-ui, sans-serif; padding: 24px 16px; text-align: center; }
    .row { display: flex; gap: 10px; justify-content: center; margin-bottom: 36px; }
    .t { width: 64px; height: 80px; border-radius: 14px; display: grid; place-items: center; font: 800 46px/1 "Bricolage Grotesque", sans-serif; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 10px 20px -10px rgba(0,0,0,.4); }
    h1 { font: 800 clamp(2rem, 6vw, 3.2rem)/1.05 "Bricolage Grotesque", sans-serif; letter-spacing: -0.03em; margin: 0 0 14px; }
    p { color: #4A4670; max-width: 40ch; margin: 0 auto 28px; }
    a { display: inline-block; background: var(--sun); color: var(--ink); font-weight: 700; text-decoration: none; padding: 1em 1.4em; border-radius: 999px; box-shadow: 0 4px 0 #D9A21A; }
    a:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="row" aria-hidden="true">
      <span class="t" style="background:var(--coral);transform:rotate(-6deg)">4</span>
      <span class="t" style="background:var(--violet);color:#fff;transform:rotate(4deg)">0</span>
      <span class="t" style="background:var(--mint);transform:rotate(-3deg)">4</span>
    </div>
    <h1>Questa pagina non c'è</h1>
    <p>Forse il link è vecchio o c'è un errore nell'indirizzo. Dalla pagina principale trovi servizi, sedi e contatti.</p>
    <a href="/imparole/">Vai alla pagina principale</a>
  </main>
</body>
</html>
