<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1E1A4D; --violet:#5B3FD9; --sun:#FFC93C; --mint:#2FB892; --coral:#FF7A6B; --sky:#4BA8F0; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); color: #fff; font-family: "Atkinson Hyperlegible", sans-serif;
    background-image: radial-gradient(rgba(255,255,255,.07) 2px, transparent 2px); background-size: 28px 28px; position: relative; }
  .glow { position: absolute; width: 700px; height: 700px; right: -200px; top: -260px; background: radial-gradient(circle, rgba(91,63,217,.55), transparent 65%); }
  .in { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .row { display: flex; gap: 14px; }
  .t { width: 112px; height: 140px; border-radius: 20px; display: grid; place-items: center; font: 800 80px/1 "Bricolage Grotesque"; color: var(--ink);
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.18), 0 18px 30px -12px rgba(0,0,0,.6); }
  h1 { font: 800 66px/1.02 "Bricolage Grotesque"; letter-spacing: -0.035em; margin: 0; max-width: 18ch; }
  p { margin: 18px 0 0; font-size: 26px; color: #C9C6EA; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="in">
    <div class="row">
      <span class="t" style="background:var(--violet);color:#fff;transform:rotate(-6deg)">i</span>
      <span class="t" style="background:var(--violet);color:#fff;transform:rotate(4deg)">m</span>
      <span class="t" style="background:var(--sun);transform:rotate(-3deg)">p</span>
      <span class="t" style="background:var(--mint);transform:rotate(5deg)">a</span>
      <span class="t" style="background:var(--coral);transform:rotate(-5deg)">r</span>
      <span class="t" style="background:var(--sky);transform:rotate(2deg)">o</span>
      <span class="t" style="background:var(--sun);transform:rotate(-2deg)">l</span>
      <span class="t" style="background:var(--mint);transform:rotate(6deg)">e</span>
    </div>
    <div>
      <h1>Ogni bambino può imparare. Insieme troviamo il suo modo.</h1>
      <p>Centro per l'Infanzia e la Famiglia · Cernusco sul Naviglio, Milano, Vimodrone, Seveso</p>
    </div>
  </div>
</body>
</html>
